[package]
name = "slopshot"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Publish squashed snapshot commits of your private git history"
readme = "README.md"
keywords = ["git", "snapshot", "publish"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"
